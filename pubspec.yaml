name: class_app
description: "Smart class routine and tasks management system with PostgreSQL backend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  uuid: ^4.3.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
